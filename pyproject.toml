[project]
name = "redline-kit"
version = "0.1.0"
description = "Native Word Track Changes, PDF redlines, and a redline miner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "python-docx>=1.2,<2",
    "lxml>=5",
    "pymupdf>=1.24,<2",
    "rapidfuzz>=3",
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
redline = "redline_kit.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redline_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"redline_kit/cli/main.py" = ["B008"]
